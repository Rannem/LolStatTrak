services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lolstattrak
      POSTGRES_USER: lolstattrak
      POSTGRES_PASSWORD: lolstattrak
    ports:
      - "5432:5432"
    volumes:
      - lolstattrak-postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    depends_on:
      - postgres
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=lolstattrak;Username=lolstattrak;Password=lolstattrak"
      Jwt__SigningKey: "local-dev-signing-key-change-me"
      Discord__ClientId: ""
      Discord__ClientSecret: ""
      RiotApi__ApiKey: ""
      Cors__AllowedOrigins__0: "http://localhost:8080"
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    depends_on:
      - backend
    environment:
      BACKEND_INTERNAL_URL: "backend:8080"
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  lolstattrak-postgres-data:
