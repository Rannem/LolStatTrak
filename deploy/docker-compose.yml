services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lolstattrak
      POSTGRES_USER: lolstattrak
      POSTGRES_PASSWORD: lolstattrak
    ports:
      - "5432:5432"
    volumes:
      - lolstattrak-postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgres://lolstattrak:lolstattrak@postgres:5432/lolstattrak"
      JWT_SIGNING_KEY: "local-dev-signing-key-change-me"
      DISCORD_CLIENT_ID: ""
      DISCORD_CLIENT_SECRET: ""
      RIOT_API_KEY: ""
      CORS_ALLOWED_ORIGINS: "http://localhost:8080"
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    depends_on:
      - backend
    environment:
      BACKEND_INTERNAL_URL: "backend:8080"
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  lolstattrak-postgres-data:
